<title>Site Pulse</title>

<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--card:#ffffff;
  --ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);
  --accent:#2a78d6;--accent-ink:#ffffff;--hover:rgba(11,11,11,.05);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --good:#0ca30c;--good-ink:#006300;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --font:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--card:#1a1a19;
  --ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);
  --accent:#3987e5;--hover:rgba(255,255,255,.06);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --good-ink:#0ca30c;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;white-space:nowrap}
.brand svg{width:24px;height:24px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--ink2);white-space:nowrap}
nav a:hover{background:var(--hover)}
nav a.active{background:var(--hover);color:var(--ink);font-weight:600}
.hdr-right{display:flex;align-items:center;gap:10px;white-space:nowrap}
.lastrun{color:var(--muted);font-size:12px}
main{max-width:1240px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:16px 0 8px;color:var(--ink2)}
.sub{color:var(--ink2);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--critical)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
label.f>input,label.f>select{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--border);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st i{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.st.good i{background:var(--good)} .st.warn i{background:var(--warning)} .st.bad i{background:var(--critical)} .st.na i{background:var(--axis)} .st.info i{background:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:12px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--hover)}
.tablewrap{overflow-x:auto}
.delta{font-size:12px;display:block}
.delta.up{color:var(--good-ink)} .delta.down{color:var(--critical)} .delta.flat{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border)}
.alert .ico{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.alert.error .ico{background:var(--critical)} .alert.warn .ico{background:var(--warning);color:#0b0b0b} .alert.info .ico{background:var(--accent)}
.alert .lvl{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.alert .site{font-weight:600}
.alert .src{color:var(--ink)}
.alert .how{margin-top:6px;font-size:13px;color:var(--ink2);background:var(--hover);border-radius:6px;padding:6px 10px}
.alert .how b{color:var(--ink);font-weight:600;margin-right:4px}
.alert .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.alert.ignored{opacity:.55}
.auscore{display:flex;gap:16px;align-items:center;margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.auscore .big{font-size:34px;font-weight:700;line-height:1} .auscore .big span{font-size:18px;color:var(--muted);font-weight:600}
.auscore.good{border-color:var(--good)} .auscore.warn{border-color:var(--warning)} .auscore.bad{border-color:var(--critical)}
.auitems{display:flex;flex-direction:column;gap:2px}
.auitem{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--grid)} .auitem:last-child{border-bottom:0}
.auico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.auitem.ok .auico{background:var(--good)} .auitem.warn .auico{background:var(--warning);color:#0b0b0b} .auitem.fail .auico{background:var(--critical)} .auitem.skip .auico{background:var(--axis)}
.aud{color:var(--ink2);margin-top:2px;word-break:break-all} .aulist{margin:4px 0 0;padding-left:18px}
.star{border:0;background:none;cursor:pointer;font-size:16px;color:var(--axis);padding:0 2px} .star.on{color:var(--s4)}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px}
table.cwv td,table.cwv th{padding:5px 10px}
.tmbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--hover);gap:2px}
.tmbar span{display:block;height:100%}
.rpalert{padding:6px 0;border-bottom:1px solid var(--grid);font-size:13px} .rpalert.error b{color:var(--critical)} .rpalert.warn b{color:#b07800}
@media print{ header,.noprint,.toast{display:none!important} body{background:#fff} main{max-width:none;padding:0} .card{break-inside:auto;border-color:#ddd} .auitem,.rpalert,tr,.auscore{break-inside:avoid} h2,h3{break-after:avoid} a{color:inherit;text-decoration:none} }
.aucrit{font-size:12px;color:var(--muted);margin-top:3px} .aucrit b{font-weight:600;color:var(--ink2);margin-right:4px}
.printonly{display:none}
@media print{ .printonly{display:inline} details{display:block} details>*{display:block} .auitem{break-inside:avoid} }
.empty{padding:28px;text-align:center;color:var(--ink2)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:center}
.steps li::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--hover);font-size:12px;font-weight:600;flex:none}
.steps li.done::before{content:"✓";background:var(--good);color:#fff}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--hover);color:var(--ink);font-weight:600}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:none!important;border-top:2px dashed}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:140px;z-index:5;display:none}
.tip .d{color:var(--ink2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r span{display:inline-flex;align-items:center;gap:6px}
.tip .r i{width:8px;height:8px;border-radius:50%}
.siteform{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--surface)}
.drop{border:2px dashed var(--axis);border-radius:10px;padding:18px;text-align:center;color:var(--ink2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--hover)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:8px;z-index:50;max-width:80vw}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.kpi.on{outline:2px solid var(--accent)}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font-size:20px;font-weight:600}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.check{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.check .t{font-size:12px;color:var(--ink2);margin-bottom:2px}
details summary{cursor:pointer;color:var(--ink2)}
.sumcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.sumcard{display:block;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.sumcard:hover{border-color:var(--accent)}
.sitename{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.sitename i{width:10px;height:10px;border-radius:3px;flex:none}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap;font-weight:600}
.pill.good{background:rgba(12,163,12,.12);color:var(--good-ink)} .pill.warn{background:rgba(250,178,25,.18);color:var(--ink)} .pill.bad{background:rgba(208,59,59,.14);color:var(--critical)} .pill.na{background:var(--hover);color:var(--ink2)}
.pill.good::before{content:"● "} .pill.warn::before{content:"▲ "} .pill.bad::before{content:"✕ "}
.sumstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sumstats .l{font-size:12px;color:var(--ink2)} .sumstats .v{font-size:22px;font-weight:650;line-height:1.2}
.chg{display:block;font-size:12px;white-space:nowrap} .chg.up{color:var(--good-ink)} .chg.down{color:var(--critical)} .chg.flat{color:var(--muted)}
table.board th[scope=row]{min-width:190px;max-width:240px;font-weight:normal}
table.board td{min-width:150px}
table.board .rl{font-weight:600;color:var(--ink);font-size:13px} table.board .rh{font-size:12px;color:var(--muted);white-space:normal}
table.board tr.grp td{background:var(--surface);font-weight:650;font-size:12px;color:var(--ink2);padding:6px 10px;letter-spacing:.02em}
table.board tbody tr.grp:hover{background:var(--surface)}
table.board .cv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
table.tp .chg{display:inline;margin-left:4px}
table.board td.tot{background:var(--surface)}
.best{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 6px;vertical-align:2px}
.bar{height:6px;background:var(--hover);border-radius:3px;margin:6px 0 4px;max-width:120px}
.bar span{display:block;height:100%;border-radius:3px}
.spark{display:block;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:760px){header{flex-wrap:wrap}.lastrun{display:none}}
</style>
</head>

 fix_site_down:["Open the site yourself. If it really is down, contact your hosting provider and check that the hosting and domain bills are paid.","직접 사이트를 열어 보세요. 정말 안 열리면 호스팅 업체에 문의하고 호스팅·도메인 요금이 결제됐는지 확인하세요.","自己打开网站看看。如果真的打不开，联系主机商，并确认主机和域名费用没有过期。"],
 fix_site_slow:["One slow check can be a fluke. If it stays slow for days, look at hosting load, page caching or a CDN.","한 번 느린 건 일시적일 수 있습니다. 며칠 계속 느리면 호스팅 부하, 페이지 캐시, CDN을 확인하세요.","偶尔一次慢可能是偶然。连续几天都慢，就检查主机负载、页面缓存或 CDN。"],
 fix_noindex:["Remove the noindex robots tag from the homepage (often an SEO plugin or a 'discourage search engines' setting).","홈페이지의 noindex 태그를 지우세요 (SEO 플러그인이나 ‘검색엔진 차단’ 설정인 경우가 많음).","删除首页的 noindex 标签（通常是 SEO 插件或“阻止搜索引擎”设置）。"],
 fix_adsense_code:["Put the AdSense code back on every page — a theme or plugin update may have removed it.","모든 페이지에 애드센스 코드를 다시 넣으세요. 테마·플러그인 업데이트로 빠졌을 수 있습니다.","把 AdSense 代码加回每个页面，可能是主题或插件更新时被去掉了。"],
 fix_ssl:["Renew the SSL certificate at your hosting provider. Let's Encrypt renews automatically — check that auto-renew is working.","호스팅에서 SSL 인증서를 갱신하세요. Let's Encrypt는 자동 갱신되니 자동 갱신이 동작하는지 확인하세요.","在主机商那里续期 SSL 证书。Let's Encrypt 会自动续期，确认自动续期在正常工作。"],
 fix_robots_block:["Edit robots.txt and remove “Disallow: /” so search engines can crawl the site.","robots.txt에서 “Disallow: /”를 지워 검색엔진이 사이트를 읽을 수 있게 하세요.","修改 robots.txt，删除“Disallow: /”，让搜索引擎能抓取网站。"],
 fix_robots_missing:["Add a robots.txt at the site root with a “Sitemap:” line (optional but recommended).","사이트 루트에 “Sitemap:” 줄이 있는 robots.txt를 추가하세요 (선택, 권장).","在网站根目录加一个带“Sitemap:”行的 robots.txt（可选，建议）。"],
 fix_sitemap:["Create a sitemap (most CMS or SEO plugins can) and submit it in Search Console → Sitemaps.","사이트맵을 만들고 (대부분 CMS·SEO 플러그인이 지원) Search Console → Sitemaps에 제출하세요.","生成站点地图（多数 CMS / SEO 插件都能做），并在 Search Console → 站点地图 提交。"],
 fix_adstxt:["Put a file at /ads.txt containing: google.com, {pubId}, DIRECT, f08c47fec0942fa0 — AdSense → Sites shows the exact line.","/ads.txt 파일에 google.com, {pubId}, DIRECT, f08c47fec0942fa0 를 넣으세요. 애드센스 → 사이트에서 정확한 줄을 볼 수 있습니다.","在 /ads.txt 里写：google.com, {pubId}, DIRECT, f08c47fec0942fa0（AdSense → 网站 里有准确的内容）。"],
 fix_domain:["Renew the domain at your registrar and turn on auto-renew.","도메인 등록 업체에서 갱신하고 자동 갱신을 켜 두세요.","在域名注册商续费，并打开自动续费。"],
 fix_gsc_sitemap:["Open Sitemaps in Search Console to see which entries fail, fix them and resubmit.","Search Console의 Sitemaps에서 어떤 항목이 오류인지 보고 고친 뒤 다시 제출하세요.","在 Search Console 的站点地图里看哪些条目出错，改好后重新提交。"],
 fix_not_indexed:["In Search Console URL inspection click “Request indexing”. New pages often take days to weeks.","Search Console URL 검사에서 ‘색인 생성 요청’을 누르세요. 새 페이지는 며칠~몇 주 걸리기도 합니다.","在 Search Console 网址检查里点“请求编入索引”。新页面通常要几天到几周。"],
 fix_redirect:["Nothing to fix: this address redirects to another page and Google indexes that page instead. From now on the app checks the page it redirects to.","고칠 필요 없습니다. 이 주소는 다른 페이지로 이동하고, Google은 이동한 페이지를 색인합니다. 앞으로는 이동한 페이지를 확인합니다.","不用处理：这个网址会跳转到别的页面，Google 收录的是跳转后的页面。以后程序会改为检查跳转后的页面。"],
 fix_ads_GETTING_READY:["Nothing to do: AdSense is reviewing the site. It usually takes a few days to a few weeks — keep the site online and keep publishing.","할 일 없음: 애드센스가 사이트를 검토 중입니다. 보통 며칠~몇 주 걸리니 사이트를 정상 운영하고 글을 계속 올리세요.","不用处理：AdSense 正在审核网站，一般要几天到几周。保持网站正常、继续更新内容就行。"],
 fix_ads_REQUIRES_REVIEW:["In AdSense → Sites, click “Request review” for this site.","애드센스 → 사이트에서 이 사이트의 ‘검토 요청’을 누르세요.","在 AdSense → 网站 里为这个网站点“请求审核”。"],
 fix_ads_NEEDS_ATTENTION:["Open AdSense → Sites to see what needs fixing, fix it and request review again.","애드센스 → 사이트에서 무엇을 고쳐야 하는지 확인하고 고친 뒤 다시 검토 요청하세요.","打开 AdSense → 网站 看需要修什么，改好后重新申请审核。"],
 fix_ads_NOT_ADDED:["Add this site in AdSense → Sites, or ignore this if you don't plan to show ads here.","애드센스 → 사이트에 추가하거나, 광고를 넣지 않을 거라면 무시하세요.","在 AdSense → 网站 里添加它；如果不打算放广告，可以忽略。"],
 fix_ads_other:["Open AdSense → Sites for details.","애드센스 → 사이트에서 자세히 확인하세요.","到 AdSense → 网站 查看详情。"],
 fix_ads_alert:["This is a notice AdSense sends to your whole account, not about one site. Read it in AdSense; if it doesn't apply to your content, click Ignore.","애드센스가 계정 전체에 보내는 공지로, 특정 사이트 문제가 아닙니다. 애드센스에서 읽어 보고 해당 없으면 ‘무시’를 누르세요.","这是 AdSense 发给整个账号的通知，不是某个网站的问题。到 AdSense 看一下，和你的内容无关就点“忽略”。"],
 fix_ads_account:["Open AdSense home to see what the account needs (e.g. address, payment or identity verification).","애드센스 홈에서 계정에 필요한 작업(주소·결제·본인 확인 등)을 확인하세요.","打开 AdSense 首页看账号需要做什么（如地址、付款或身份验证）。"],
 fix_ads_policy:["Open AdSense → Policy center, fix the listed page, then request a review.","애드센스 → 정책 센터에서 해당 페이지를 고친 뒤 검토를 요청하세요.","打开 AdSense → 政策中心，修改列出的页面，然后申请审核。"],
 fix_auth_google:["Go to Settings and click “Sign in with Google” again.","설정에서 ‘Google로 로그인’을 다시 누르세요.","到设置里重新点“使用 Google 登录”。"],
 fix_auth_bing:["Generate a new key in Bing Webmaster Tools → Settings → API access and save it in Settings.","Bing 웹마스터 도구 → 설정 → API 액세스에서 새 키를 만들어 설정에 저장하세요.","在 Bing Webmaster Tools → 设置 → API 访问 生成新密钥，填到设置里。"],
 fix_metric_drop:["Open the site page and look at the chart. One-day dips happen (holidays, Google updates); if it lasts, check the other alerts for site problems.","사이트 페이지에서 차트를 보세요. 하루 하락은 흔합니다 (휴일, Google 업데이트). 계속되면 다른 알림에서 사이트 문제를 확인하세요.","打开网站页面看图表。一天的下降很常见（节假日、Google 更新）；如果持续，看看其他提醒里有没有网站问题。"],
 fix_metric_rise:["Good news — see which keywords drove it on the Keywords page.","좋은 소식입니다. 키워드 페이지에서 어떤 검색어 덕분인지 확인하세요.","好消息——到关键词页面看看是哪些搜索词带来的。"],
 fix_source_error_bing:["Check that the Bing API key in Settings is correct and that this site is added in Bing Webmaster Tools.","설정의 Bing API 키가 맞는지, 이 사이트가 Bing 웹마스터 도구에 추가돼 있는지 확인하세요.","检查设置里的 Bing API 密钥是否正确，以及这个网站是否已添加到 Bing Webmaster Tools。"],
 fix_source_error:["Check the connection in Settings. “Permission denied” means this Google account has no access to that property.","설정에서 연결을 확인하세요. ‘권한 없음’이면 이 Google 계정에 해당 속성 권한이 없는 것입니다.","到设置里检查连接。如果提示没有权限，说明这个 Google 账号没有该资源的访问权。"],

 au_intro:["Checks what AdSense reviewers usually look at. Green items are fine; fix the red ones first. This is a guide — Google makes the final decision.","애드센스 심사에서 흔히 보는 항목을 점검합니다. 빨간 항목부터 고치세요. 참고용이며 최종 판단은 Google이 합니다.","检查 AdSense 审核通常会看的项目。先改红色的项目。这只是参考，最终由 Google 决定。"],

 auf_navigation:["Add a menu that links to your main categories and key pages so visitors (and reviewers) can find content.","주요 카테고리와 페이지로 가는 메뉴를 만드세요. 방문자와 심사자가 글을 찾기 쉬워야 합니다.","加一个导航菜单，链接到主要分类和重要页面，方便访客和审核人员找到内容。"],
 auf_lang:["Add lang to the <html> tag, e.g. <html lang=\"ko\">. AdSense must support the site's language.","<html lang=\"ko\">처럼 언어를 지정하세요. 애드센스가 지원하는 언어여야 합니다.","在 <html> 标签上写语言，如 <html lang=\"ko\">。网站语言需要是 AdSense 支持的语言。"],

 auf_page_privacy:["Add a privacy policy page linked from every page (footer). It must mention cookies and Google ads.","모든 페이지(푸터)에서 연결되는 개인정보처리방침을 만드세요. 쿠키와 Google 광고 내용이 들어가야 합니다.","加一个隐私政策页面，并在每页页脚链接。里面要提到 Cookie 和 Google 广告。"],
 auf_page_about:["Add an About page that says who runs the site and what it is for.","누가 어떤 목적으로 운영하는 사이트인지 설명하는 소개 페이지를 만드세요.","加一个“关于”页面，说明谁在运营、网站是做什么的。"],
 auf_page_contact:["Add a contact page (an email address or a form) linked from the menu or footer.","메뉴나 푸터에서 연결되는 문의 페이지(이메일 또는 문의 양식)를 만드세요.","加一个联系页面（邮箱或表单），并在菜单或页脚链接。"],
 auf_page_terms:["Optional, but a terms of use page makes the site look complete.","선택 사항이지만 이용약관이 있으면 사이트가 더 완성돼 보입니다.","可选，但有使用条款页面会让网站看起来更完整。"],
 auf_content_count:["Publish more original articles. Many sites are approved with about 20–30 useful posts.","직접 쓴 글을 더 올리세요. 보통 유용한 글 20–30개 정도에서 승인되는 경우가 많습니다.","多发一些原创文章。很多网站在有 20–30 篇有用文章时通过审核。"],
 auf_thin_content:["Expand short pages to at least {min} words of your own text, or merge / remove them. “Low value content” is the most common rejection reason.","짧은 페이지는 직접 쓴 내용을 {min}단어 이상으로 늘리거나 합치거나 지우세요. ‘가치 없는 콘텐츠’가 가장 흔한 거절 사유입니다.","把短页面扩充到至少 {min} 词的原创内容，或合并、删除。“价值不高的内容”是最常见的拒绝原因。"],
 auf_placeholder:["Finish or remove pages with placeholder text (e.g. “coming soon”, “준비 중”, sample pages).","‘준비 중’, ‘coming soon’, 예시 페이지 같은 미완성 페이지는 완성하거나 지우세요.","把带有“即将推出”“建设中”或示例内容的页面写完或删除。"],
 auf_sample_broken:["Fix or remove the pages that return errors, and update the sitemap.","오류 나는 페이지를 고치거나 지우고 사이트맵을 갱신하세요.","修复或删除打不开的页面，并更新站点地图。"],
 auf_dup_titles:["Give every page its own title — duplicates look like copied or auto-generated content.","페이지마다 다른 제목을 쓰세요. 중복 제목은 복사·자동 생성 콘텐츠처럼 보입니다.","每个页面用不同的标题，重复标题看起来像复制或自动生成的内容。"],

 s_psi_help:["Page speed is checked once a day and works without a key, but Google sometimes limits anonymous use. If you see a quota message, create an API key in Google Cloud (APIs & Services → Credentials → Create credentials → API key, project site-monitor) and paste it here.","속도는 하루 한 번 확인하며 키 없이도 되지만 Google이 익명 사용을 제한할 때가 있습니다. 한도 메시지가 나오면 Google Cloud(API 및 서비스 → 사용자 인증 정보 → API 키, site-monitor 프로젝트)에서 키를 만들어 넣으세요.","每天检查一次速度，不填密钥也能用，但 Google 有时会限制匿名请求。如果看到额度提示，在 Google Cloud（API 和服务 → 凭据 → 创建凭据 → API 密钥，项目 site-monitor）建一个密钥填到这里。"],

 auc_reachable:["Pass: the homepage (after any redirect) opens with HTTP 200 over HTTPS. Improve: opens but not HTTPS. Fix: does not open.","통과: 홈페이지(이동 후)가 HTTPS로 HTTP 200. 개선: 열리지만 HTTPS 아님. 수정: 열리지 않음.","通过：首页（跟随跳转后）用 HTTPS 正常打开（HTTP 200）。建议改进：能打开但不是 HTTPS。需要修改：打不开。"],
 auc_indexable:["Pass: the landing page has no “noindex” tag and robots.txt does not contain “Disallow: /” for all crawlers.","통과: 첫 페이지에 noindex 태그가 없고 robots.txt에 모든 크롤러 대상 “Disallow: /”가 없음.","通过：首页没有 noindex 标签，robots.txt 里没有针对所有爬虫的“Disallow: /”。"],
 auc_mobile:["Pass: the page has a <meta name=\"viewport\"> tag (needed for phones).","통과: <meta name=\"viewport\"> 태그가 있음 (휴대폰 표시에 필요).","通过：页面有 <meta name=\"viewport\"> 标签（手机显示需要）。"],
 auc_navigation:["Pass: the page has a <nav> menu or at least 8 links to its own pages. Otherwise: improve.","통과: <nav> 메뉴가 있거나 내부 링크가 8개 이상. 아니면 개선 권장.","通过：页面有 <nav> 菜单，或至少 8 个站内链接；否则建议改进。"],
 auc_lang:["Pass: the <html> tag has a lang attribute (e.g. lang=\"ko\").","통과: <html> 태그에 lang 속성이 있음 (예: lang=\"ko\").","通过：<html> 标签有 lang 属性（如 lang=\"ko\"）。"],
 auc_meta:["Pass: the landing page has both a <title> and a meta description.","통과: 첫 페이지에 <title>과 meta description이 모두 있음.","通过：首页同时有 <title> 和 meta description。"],
 auc_page_privacy:["Looks for a link on the homepage (after redirect) whose text or address contains privacy / 개인정보 / 隐私; if none, an address in the sitemap. Pass: linked from the homepage, opens, and has at least 80 words. Improve: too short, or only in the sitemap. Fix: not found or broken.","홈페이지(이동 후)에서 글자나 주소에 privacy / 개인정보 / 隐私가 들어간 링크를 찾고, 없으면 사이트맵 주소에서 찾습니다. 통과: 홈페이지에 링크가 있고 열리며 80단어 이상. 개선: 너무 짧거나 사이트맵에만 있음. 수정: 없거나 열리지 않음.","在首页（跟随跳转后）找文字或网址包含 privacy / 개인정보 / 隐私 的链接，找不到再看站点地图里的网址。通过：首页有链接、能打开、至少 80 词。建议改进：内容太短，或只在站点地图里。需要修改：找不到或打不开。"],
 auc_page_about:["Same method with about / 소개 / 关于: linked from the homepage, opens, at least 80 words.","같은 방법으로 about / 소개 / 关于 를 찾습니다: 홈페이지 링크, 열림, 80단어 이상.","同样方法找 about / 소개 / 关于：首页有链接、能打开、至少 80 词。"],
 auc_page_contact:["Same method with contact / 문의 / 联系: linked from the homepage, opens, at least 80 words (a form or email counts as content too).","같은 방법으로 contact / 문의 / 联系 를 찾습니다: 홈페이지 링크, 열림, 80단어 이상.","同样方法找 contact / 문의 / 联系：首页有链接、能打开、至少 80 词。"],
 auc_page_terms:["Optional. Same method with terms / 이용약관 / 条款; missing only gives a suggestion.","선택 사항. terms / 이용약관 / 条款 로 찾으며 없으면 권장만 표시.","可选。用 terms / 이용약관 / 条款 查找，没有只给建议。"],
 auc_content_count:["Counts pages in the sitemap (limited to the site's path). Pass: 25 or more. Improve: 10–24. Fix: under 10.","사이트맵의 페이지 수(사이트 경로 기준). 통과: 25개 이상. 개선: 10–24. 수정: 10개 미만.","统计站点地图里的页面数（按网站路径）。通过：25 个以上。建议改进：10–24 个。需要修改：少于 10 个。"],
 auc_thin_content:["Opens the 25 newest articles (legal, listing and home pages excluded) and counts body words without header, menu and footer; Chinese/Japanese characters count as half a word. Short = under 300 words. Pass: none short. Improve: some short. Fix: more than 30% short.","최신 글 25개(법적 페이지·목록·홈 제외)를 열어 헤더·메뉴·푸터를 뺀 본문 단어를 셉니다. 300단어 미만이면 짧은 글. 통과: 없음. 개선: 일부. 수정: 30% 초과.","打开最新的 25 篇文章（不含法律页面、列表页和首页），统计去掉页头、菜单、页脚后的正文词数，中日文每字算半词。少于 300 词算短。通过：没有短文。建议改进：有一些。需要修改：超过 30%。"],
 auc_placeholder:["Fix if the homepage or a checked article contains text like “coming soon”, “준비 중입니다”, “建设中”, “lorem ipsum” or sample-page text.","홈이나 확인한 글에 “coming soon”, “준비 중입니다”, “建设中”, “lorem ipsum”, 예시 페이지 문구가 있으면 수정 필요.","首页或检查的文章里有“coming soon”“준비 중입니다”“建设中”“lorem ipsum”或示例页面文字时，需要修改。"],
 auc_sample_broken:["Fix if any checked article returns an error (4xx/5xx) or doesn't open.","확인한 글 중 오류(4xx/5xx)이거나 열리지 않는 것이 있으면 수정 필요.","检查的文章里有报错（4xx / 5xx）或打不开的，需要修改。"],
 auc_dup_titles:["Improve if two or more checked articles share the same <title>.","확인한 글 중 2개 이상이 같은 <title>이면 개선 권장.","检查的文章里有两篇以上 <title> 相同时，建议改进。"],
 auc_adsense_code:["Pass: the landing page HTML contains the AdSense script (adsbygoogle / pagead2.googlesyndication.com).","통과: 첫 페이지 HTML에 애드센스 스크립트(adsbygoogle / pagead2.googlesyndication.com)가 있음.","通过：首页 HTML 里有 AdSense 脚本（adsbygoogle / pagead2.googlesyndication.com）。"],
 auc_adstxt:["Pass: /ads.txt at the domain root contains “google.com, <your pub ID>, DIRECT”.","통과: 도메인 루트의 /ads.txt에 “google.com, <내 pub ID>, DIRECT”가 있음.","通过：域名根目录的 /ads.txt 里有“google.com, <你的 pub ID>, DIRECT”。"],

let LANG = 'en';
const LI = {en:0,ko:1,zh:2};
function t(k, p){ const e=I18N[k]; let s = e ? (e[LI[LANG]] ?? e[0]) : k; if(p) s = s.replace(/\{(\w+)\}/g,(m,n)=> p[n]!==undefined ? p[n] : m); return s; }
function stName(s){ return I18N['st_'+s] ? t('st_'+s) : (s||''); }

// ---------------- utils ----------------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts={}){
  const o = {...opts, headers:{...(opts.headers||{})}};
  if(o.method && o.method!=='GET') o.headers['X-Site-Pulse']='1';
  if(o.json!==undefined){ o.body=JSON.stringify(o.json); o.headers['Content-Type']='application/json'; delete o.json; }
  const r = await fetch(path, o);
  let data=null; try{ data = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 3500); }
const pad = n => String(n).padStart(2,'0');
const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => ds(new Date());
function locale(){ return LANG==='ko'?'ko-KR':LANG==='zh'?'zh-CN':'en-US'; }
function fmtDate(s, long, withYear){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(locale(), long?{year:'numeric',month:'short',day:'numeric'}:withYear?{year:'2-digit',month:'short',day:'numeric'}:{month:'short',day:'numeric'}); }

function lineChart(el, {series, dates, fmt, height=260, yLabel, minZero=true, invert=false}){

  if(series.length>1){
    const lg = document.createElement('div'); lg.className='legend';

  el.appendChild(wrap);
  const W = Math.max(320, el.clientWidth||800), H=height, m={l:56,r: series.length<=4 && series.length>1 ? 150 : 16, t:10, b:28};
  const iw=W-m.l-m.r, ih=H-m.t-m.b;

  const x = i => m.l + (dates.length<=1 ? iw/2 : i*iw/(dates.length-1));
  const y = v => invert ? m.t + (v-lo)/(hi-lo)*ih : m.t + ih - (v-lo)/(hi-lo)*ih;
  const NS='http://www.w3.org/2000/svg';

  svg.setAttribute('role','img'); if(yLabel) svg.setAttribute('aria-label', yLabel);
  let g = '';
  ticks.forEach(tv=>{ g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${m.l-8}" y="${y(tv)+4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${esc(fmt(tv,true))}</text>`; });

  const labelYs=[];

    g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    // isolated points get a marker so they are visible
    dates.forEach((d,i)=>{ const v=s.points[d]; if(v===undefined||v===null) return; const pv=s.points[dates[i-1]], nv=s.points[dates[i+1]];
      if((pv===undefined||pv===null)&&(nv===undefined||nv===null)) g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`; });
    if(series.length>1 && series.length<=4){
      let li=-1; for(let i=dates.length-1;i>=0;i--){ if(s.points[dates[i]]!==undefined&&s.points[dates[i]]!==null){li=i;break;} }
      if(li>=0) labelYs.push({y:y(s.points[dates[li]]), name:s.name});
    }
  });

  labelYs.forEach(l=>{ const nm = l.name.length>20 ? l.name.slice(0,19)+'…' : l.name; g+=`<text x="${W-m.r+8}" y="${l.y+4}" font-size="11" fill="var(--ink2)">${esc(nm)}</text>`; });
  g+=`<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--axis)" stroke-width="1" style="display:none"/>`;
  g+=`<g id="dots"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g; wrap.appendChild(svg);
  const tip = document.createElement('div'); tip.className='tip'; wrap.appendChild(tip);
  const xh = svg.querySelector('#xh'), dots = svg.querySelector('#dots'), hit = svg.querySelector('#hit');
  const show = ev => {

    const i = dates.length<=1 ? 0 : Math.max(0, Math.min(dates.length-1, Math.round((px-m.l)/iw*(dates.length-1))));

  const tw = document.createElement('div'); tw.className='tablewrap';

    dates.slice().reverse().map(d=>`<tr><td>${esc(fmtDate(d,true))}</td>${series.map(s=>`<td class="num">${s.points[d]===undefined?'—':esc(fmt(s.points[d]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

// raw ingredients so ratios (CTR, position, RPM) can be combined correctly across days and sites
function aggParts(md, row, dates){
  let n=0, a=0, b=0;
  for(const d of dates){ const x = md?.[d]; if(!x || x[row.k]===undefined) continue; n++;
    if(row.agg==='ctr'){ a+=x.gsc_clicks||0; b+=x.gsc_impr||0; }
    else if(row.agg==='pos'){ const w=x.gsc_impr||0; a+=x.gsc_pos*w; b+=w; }

}
function aggValue(row, p){
  if(!p || !p.n) return null;
  if(row.agg==='sum') return p.a;
  if(row.agg==='avg') return p.a/p.n;
  if(row.agg==='ctr') return p.b ? p.a/p.b*100 : null;

  if(row.agg==='rpm') return p.b ? p.a/p.b*1000 : null;

function addParts(ps){ const o={n:0,a:0,b:0}; ps.forEach(p=>{ if(p){ o.n=Math.max(o.n,p.n); o.a+=p.a; o.b+=p.b; } }); return o; }
// the window ends on the latest day any site has this metric (Search Console lags 2–3 days)
function windowFor(k, N){
  const td = today(); let end='';
  for(const md of Object.values(METRICS_DATA)) for(const d in md) if(d<td && md[d][k]!==undefined && d>end) end=d;
  if(!end) return null;
  const e = new Date(end+'T00:00:00');
  const cur=[], prev=[];
  for(let i=N-1;i>=0;i--) cur.push(ds(addDays(e,-i)));
  for(let i=2*N-1;i>=N;i--) prev.push(ds(addDays(e,-i)));

}
function sparkline(vals, color, lower){
  const pts = vals.map((v,i)=>[i,v]).filter(p=>p[1]!==undefined&&p[1]!==null);
  if(pts.length<2) return '';
  const W=88,H=24; const ys=pts.map(p=>p[1]); let lo=Math.min(...ys), hi=Math.max(...ys); if(hi===lo){ hi=lo+1; }
  const x=i=>2+i*(W-4)/(vals.length-1), y=v=> lower ? 2+(v-lo)/(hi-lo)*(H-4) : H-2-(v-lo)/(hi-lo)*(H-4);
  const d = pts.map((p,j)=>(j?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join('');
  const last = pts[pts.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last[0])}" cy="${y(last[1])}" r="2.5" fill="${color}"/></svg>`;
}
function changeHtml(row, cur, prev){

  if(row.agg==='ctr'){ const diff=cur-prev; if(Math.abs(diff)<0.05) return `<span class="chg flat">${t('same')}</span>`;
    return `<span class="chg ${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${(diff>0?'+':'')+diff.toFixed(1)}%p</span>`; }
  if(prev===0) return cur>0 ? `<span class="chg up">▲ ${t('new_q')}</span>` : `<span class="chg flat">${t('same')}</span>`;

    <div class="legend" style="margin-top:6px">${segs.map(([k,v,c])=>`<span><i style="background:var(${c});height:8px;width:8px;border-radius:2px"></i>${t(k)} <b>${v} ms</b></span>`).join('')}</div>

}
function renderSite(m, id){

  checks += c(t('domain_exp'), dm ? (dm.days!==undefined ? stDot(dm.days<(S.domainWarn||30)?'warn':'good', t('expires_in',{n:dm.days, d:fmtDate(dm.expiry.slice(0,10),true)})) : stDot('na', t('unavailable'))) + `<div class="small muted">${esc(dm.domain)}</div>` : stDot('na', t('not_checked')));
  checks += c(t('robots'), rb ? (rb.blocksAll ? stDot('bad', t('blocks_all')) : rb.ok ? stDot('good', t('ok')) : stDot('warn', t('missing')+(rb.status?' (HTTP '+rb.status+')':''))) : stDot('na', t('not_checked')));
  checks += c(t('sitemap'), sm ? (sm.ok ? stDot('good', t('urls',{n:(sm.urls||0).toLocaleString(locale())})) : stDot('warn', t('missing'))) + `<div class="small muted mono">${esc(sm.url)}</div>` : stDot('na', t('not_checked')));
  if(at) checks += c(t('adstxt'), at.ok ? stDot('good', t('ok')+(at.pubId?' · '+at.pubId:'')) : at.found===false ? stDot('bad', t('missing')) : stDot('bad', t('mismatch')+(at.pubId?' · '+at.pubId:'')));
  const lk = st.links; if(lk) checks += c(t('pg_tab_links'), `<a href="#pages/links">${lk.broken ? stDot(lk.brokenInternal?'bad':'warn', t('a_broken_links',{n:lk.broken})) : stDot('good', t('lk_none',{n:lk.checked}))}</a>`);

  }

  }
  if(sms?.length || ins?.length) html += `</div>`;
  m.innerHTML = html;
  const draw = ()=>{ const dates=dateRange(view.range); const k=view.siteMetric;
    lineChart($('#siteChart'), {series:[{name:t('m_'+k), color:cssVar('--s1'), points:Object.fromEntries(dates.map(d=>[d,md[d]?.[k]]).filter(([d,v])=>v!==undefined))}], dates, fmt:(v,c)=>fmtVal(k,v,c), yLabel:t('m_'+k), invert:!!METRICS[k].lower, minZero:!METRICS[k].lower}); };
  m.querySelectorAll('.kpi').forEach(el=>{ const go=()=>{ view.siteMetric=el.dataset.k; saveView(); renderSite(m,id); }; el.addEventListener('click',go); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }); });

function drawTrends(){
  const el=$('#trChart'); if(!el) return;
  const sel = TRENDS.filter(x=>view.trSel.includes(x.id));
  const overlay = view.overlay && view.kwSeries && view.kwSel.length;
  if(!sel.length && !overlay){ el.innerHTML=''; return; }
  let dates = Array.from(new Set(sel.flatMap(x=>Object.keys(x.points)))).sort();
  const series = sel.map((x,i)=>({name:x.term+(x.geo?` (${x.geo})`:''), color:cssVar(SERIES_VARS[i%8]), points:x.points}));
  if(overlay){
    const kd = kwDates();
    if(!dates.length) dates = kd;
    // weekly Trends data: bucket daily clicks into the Trends periods
    const weekly = dates.length>1 && (new Date(dates[1]) - new Date(dates[0])) > 2*864e5;
    view.kwSel.forEach((q,i)=>{
      const daily = kwPoints(q,'clicks'); let pts={};
      // daily mean per Trends period, so partial weeks at the edges are not under-counted
      if(weekly){ const per = Math.round((new Date(dates[1]) - new Date(dates[0]))/864e5); dates.forEach((d,j)=>{ const next=dates[j+1]||ds(addDays(new Date(d+'T00:00:00'), per)); let sum=0, n=0; kd.forEach(k=>{ if(k>=d && k<next){ sum+=daily[k]||0; n++; } }); if(n) pts[d]=sum/n; }); }
      else pts = daily;
      const mx = Math.max(0,...Object.values(pts)); if(mx>0) Object.keys(pts).forEach(k=>pts[k]=pts[k]/mx*100);
      series.push({name:'GSC: '+q, color:cssVar(SERIES_VARS[(sel.length+i)%8]), dash:true, points:pts});
    });
    if(!weekly) dates = Array.from(new Set([...dates, ...kd])).sort();
  }
  lineChart(el, {series, dates, fmt:v=>Math.round(v).toString(), yLabel:t('interest')});
}

// ---------------- weekly reports ----------------
function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }
function weekDates(mon){ const m=new Date(mon+'T00:00:00'); return Array.from({length:7},(_,i)=>ds(addDays(m,i))); }
function reportWeeks(){
  let first='9999';
  for(const md of Object.values(METRICS_DATA)) for(const d in md) if(d<first) first=d;
  const out=[]; let mon = addDays(mondayOf(new Date()), -7);
  for(let i=0;i<26;i++){ const m=ds(mon); if(ds(addDays(mon,6))<first) break; out.push(m); mon=addDays(mon,-7); }
  return out;
}
async function renderReports(m, week){
  if(week) return renderReport(m, week);
  const weeks = reportWeeks();
  m.innerHTML = `<h1>${t('nav_reports')}</h1><p class="sub">${t('rp_intro')}</p><div class="card">${weeks.length?`<table><tbody>${weeks.map((w,i)=>`<tr><td><b>${esc(fmtDate(w,true))} – ${esc(fmtDate(weekDates(w)[6],true))}</b>${i===0?` <span class="tag">${t('rp_latest')}</span>`:''}</td><td style="text-align:right"><a class="btn sm" href="#reports/${w}">${t('rp_open')}</a> <button class="btn sm" data-xl="${w}">${t('rp_excel')}</button></td></tr>`).join('')}</tbody></table>`:`<div class="muted">${t('no_data')}</div>`}</div>`;
  m.querySelectorAll('[data-xl]').forEach(b=>b.addEventListener('click', async ()=>{ b.disabled=true; try{ await exportExcel(await buildReport(b.dataset.xl)); }catch(e){ toast(t('err',{e:e.message})); } b.disabled=false; }));
}
async function buildReport(week){
  const dates = weekDates(week), prevDates = weekDates(ds(addDays(new Date(week+'T00:00:00'),-7)));
  const runs = (await Promise.all(dates.map(d=>api('/api/run?date='+d).catch(()=>null)))).filter(Boolean);
  const ign = new Set(S.ignored||[]);
  const sites = (S.sites||[]).map(s=>{
    const md = METRICS_DATA[s.id]||{};
    const rows = CMP_ROWS.flatMap(g=>g.rows).map(row=>{
      const cur = aggValue(row, aggParts(md,row,dates)), prev = aggValue(row, aggParts(md,row,prevDates));
      return {row, cur, prev};
    }).filter(r=>r.cur!==null || r.prev!==null);
    // alerts seen during the week (deduplicated, with number of days)
    const seen = {};
    runs.forEach(rn=>(rn.alerts||[]).forEach(a=>{ if(a.siteId!==s.id || a.code==='weekly_report') return; const k=alertKey(a); if(ign.has(k)) return; (seen[k] ||= {a, days:0}).days++; }));
    const lastRun = runs[runs.length-1]; const sc = lastRun?.sites?.find(x=>x.siteId===s.id);
    return {site:s, rows, md, alerts:Object.values(seen).sort((x,y)=>levelRank(x.a.level)-levelRank(y.a.level)), sc};
  });
  const acct = {}; runs.forEach(rn=>(rn.alerts||[]).forEach(a=>{ if(a.siteId||a.code==='weekly_report') return; const k=alertKey(a); if(ign.has(k)) return; (acct[k] ||= {a, days:0}).days++; }));
  return {week, dates, sites, account:Object.values(acct)};
}
function levelRank(l){ return l==='error'?0:l==='warn'?1:2; }
const DAILY_KEYS = ['ga_users','ga_views','gsc_clicks','gsc_impr','gsc_pos','ads_earnings','ads_rpm','bing_clicks','psi_m_score'];
async function renderReport(m, week){
  m.innerHTML = `<div class="muted"><span class="spin"></span> ${t('loading')}</div>`;
  const R = await buildReport(week);
  const chgTxt = (row,c,p)=>{ if(c===null||p===null||p===undefined) return '—'; if(row.agg==='pos'){ const d=p-c; return Math.abs(d)<0.05?t('same'):(d>0?'▲ ':'▼ ')+Math.abs(d).toFixed(1); } if(row.agg==='ctr'){ const d=c-p; return Math.abs(d)<0.05?t('same'):(d>0?'▲ +':'▼ ')+d.toFixed(1)+'%p'; } if(!p) return c?t('new_q'):'—'; const pct=(c-p)/p*100; return Math.abs(pct)<0.5?t('same'):(pct>0?'▲ ':'▼ ')+fmtPct(pct); };
  const chgCls = (row,c,p)=>{ if(c===null||p===null||p===undefined||!p&&row.agg!=='pos'||chgTxt(row,c,p)===t('same')) return 'flat'; const better = row.lower ? c<p : c>p; return better?'up':'down'; };
  let html = `<div class="noprint row" style="margin-bottom:12px"><a href="#reports">${t('back_reports')}</a><span class="grow"></span><button class="btn" id="rpPrint">${t('rp_print')}</button><button class="btn" id="rpXl">${t('rp_excel')}</button></div>
  <div class="report"><h1>Site Pulse · ${t('rp_title')}</h1><p class="sub">${esc(fmtDate(R.dates[0],true))} – ${esc(fmtDate(R.dates[6],true))} · ${t('rp_vs_prev')}</p>`;
  if(R.account.length) html += `<div class="card"><h2>${t('rp_account')}</h2>${R.account.map(x=>`<div class="small">• ${esc(alertText(x.a))}</div>`).join('')}</div>`;
  R.sites.forEach(S_=>{
    const s=S_.site;
    html += `<div class="card rpsite"><h2>${esc(s.name)} <span class="small muted mono">${esc(s.url)}</span></h2>`;
    html += `<table><thead><tr><th>${t('metric')}</th><th class="num">${t('rp_this')}</th><th class="num">${t('rp_last')}</th><th class="num">${t('change')}</th></tr></thead><tbody>${S_.rows.map(({row,cur,prev})=>`<tr><td>${t(row.label)}</td><td class="num"><b>${cur===null?'—':esc(fmtVal(row.k,cur))}</b></td><td class="num muted">${prev===null?'—':esc(fmtVal(row.k,prev))}</td><td class="num"><span class="delta ${chgCls(row,cur,prev)}" style="display:inline">${chgTxt(row,cur,prev)}</span></td></tr>`).join('')}</tbody></table>`;
    const keys = DAILY_KEYS.filter(k=>R.dates.some(d=>S_.md[d]?.[k]!==undefined));
    if(keys.length) html += `<h3>${t('rp_daily')}</h3><div class="tablewrap"><table><thead><tr><th>${t('date')}</th>${keys.map(k=>`<th class="num">${t('m_'+k)}</th>`).join('')}</tr></thead><tbody>${R.dates.map(d=>`<tr><td>${esc(fmtDate(d))}</td>${keys.map(k=>`<td class="num">${S_.md[d]?.[k]!==undefined?esc(fmtVal(k,S_.md[d][k])):'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const ps = S_.sc?.gsc?.pages, lk = S_.sc?.status?.links, psi = S_.sc?.status?.psi?.mobile;
    const health = [];
    if(ps) health.push(t('rp_h_index',{i:ps.indexed, n:ps.total, s:ps.slow||0}));
    if(lk) health.push(t('rp_h_links',{n:lk.broken||0}));
    if(psi && !psi.error) health.push(t('rp_h_speed',{n:Math.round(psi.score)}));
    if(health.length) html += `<h3>${t('g_health')}</h3><p class="small">${health.map(esc).join(' · ')}</p>`;
    html += `<h3>${t('rp_alerts')}</h3>` + (S_.alerts.length ? S_.alerts.map(x=>{ const info=alertInfo(x.a); return `<div class="rpalert ${x.a.level}"><b>${t('lvl_'+x.a.level)}</b> · ${esc(t(info.src))} — ${esc(alertText(x.a))} <span class="muted small">(${t('rp_days',{n:x.days})})</span>${info.how?`<div class="small muted">${t('how_fix')} ${esc(t(info.how, x.a.params||{}))}</div>`:''}</div>`; }).join('') : `<p class="small">${t('no_alerts')}</p>`);
    html += `</div>`;
  });
  html += `<p class="small muted">${t('rp_generated',{d:new Date().toLocaleString(locale())})}</p></div>`;
  m.innerHTML = html;
  $('#rpPrint').addEventListener('click', ()=>window.print());
  $('#rpXl').addEventListener('click', async e=>{ e.target.disabled=true; try{ await exportExcel(R); }catch(err){ toast(t('err',{e:err.message})); } e.target.disabled=false; });
}
async function exportExcel(R){
  const summary = [[t('site'), t('metric'), t('rp_this'), t('rp_last'), t('change')]];
  const daily = [[t('site'), t('date'), ...DAILY_KEYS.map(k=>t('m_'+k))]];
  const alerts = [[t('site'), t('lvl_warn')+' / '+t('lvl_error'), t('rp_source'), t('alerts'), t('how_fix'), t('rp_days_col')]];
  const round = v => v===null||v===undefined ? null : Math.round(v*100)/100;
  R.sites.forEach(S_=>{
    S_.rows.forEach(({row,cur,prev})=>{ const pct = cur!==null&&prev ? Math.round((cur-prev)/prev*1000)/10 : null; summary.push([S_.site.name, t(row.label), round(cur), round(prev), pct===null?'':pct+'%']); });
    R.dates.forEach(d=>daily.push([S_.site.name, d, ...DAILY_KEYS.map(k=>round(S_.md[d]?.[k]))]));
    S_.alerts.forEach(x=>{ const info=alertInfo(x.a); alerts.push([S_.site.name, t('lvl_'+x.a.level), t(info.src), alertText(x.a), info.how?t(info.how,x.a.params||{}):'', x.days]); });
  });
  R.account.forEach(x=>{ const info=alertInfo(x.a); alerts.push([t('scope_account'), t('lvl_'+x.a.level), t(info.src), alertText(x.a), info.how?t(info.how,x.a.params||{}):'', x.days]); });
  const name = `Site Pulse ${R.dates[0]}~${R.dates[6]}`;
  const res = await fetch('/api/xlsx',{method:'POST',headers:{'X-Site-Pulse':'1','Content-Type':'application/json'},body:JSON.stringify({filename:name, sheets:[{name:t('rp_sheet_summary'),rows:summary},{name:t('rp_sheet_daily'),rows:daily},{name:t('alerts'),rows:alerts}]})});
  if(!res.ok) throw new Error(res.statusText);
  const blob = await res.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name+'.xlsx'; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

  const drawForms = ()=>{
    const o = OPTIONS||{}; const opt = (list, val) => `<option value="">${t('none_opt')}</option>` + (list||[]).map(x=>`<option value="${esc(x.v)}" ${x.v===val?'selected':''}>${esc(x.l)}</option>`).join('') + (val && !(list||[]).some(x=>x.v===val) ? `<option value="${esc(val)}" selected>${esc(val)}</option>`:'');
    const gsc = (o.gsc||[]).map(x=>({v:x.url,l:x.url})), ga=(o.ga||[]).map(x=>({v:x.id,l:`${x.name} (${x.id.replace('properties/','')}) — ${x.account}`})), bing=(o.bing||[]).map(x=>({v:x,l:x})), ads=(o.ads||[]).map(x=>({v:x.domain.replace(/^www\./,''),l:`${x.domain} · ${stName(x.state)}`}));
    $('#siteForms').innerHTML = draft.map((s,i)=>`<div class="siteform" data-i="${i}"><div class="grid2">
      <label class="f">${t('f_name')}<input type="text" data-f="name" value="${esc(s.name)}"></label>
      <label class="f">${t('f_url')}<input type="text" data-f="url" value="${esc(s.url)}" placeholder="https://example.com/"></label>
      <label class="f">${t('f_gsc')}<select data-f="gscProperty">${opt(gsc,s.gscProperty)}</select></label>
      <label class="f">${t('f_ga')}<select data-f="gaProperty">${opt(ga,s.gaProperty)}</select></label>
      <label class="f">${t('f_ads')}<select data-f="adsDomain">${opt(ads,s.adsDomain)}</select></label>
      <label class="f">${t('f_bing')}<select data-f="bingSite">${opt(bing,s.bingSite)}</select></label></div>
      <label class="f" style="margin-top:10px">${t('f_pages')}<textarea data-f="keyPages" rows="2">${esc((s.keyPages||[]).join('\n'))}</textarea></label>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-auto="${i}">${t('automatch')}</button><span class="grow"></span><button class="btn danger sm" data-rm="${i}">${t('remove')}</button></div></div>`).join('');
    $('#siteForms').querySelectorAll('.siteform').forEach(f=>{ const i=+f.dataset.i; f.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('input', ()=>{ const k=inp.dataset.f; draft[i][k] = k==='keyPages' ? inp.value.split('\n') : inp.value; })); });
    $('#siteForms').querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{ draft.splice(+b.dataset.rm,1); drawForms(); }));
    $('#siteForms').querySelectorAll('[data-auto]').forEach(b=>b.addEventListener('click', ()=>{ autoMatch(draft[+b.dataset.auto]); drawForms(); }));
    const errs = o.errors||{}; $('#optErr').textContent = OPTIONS===null && S.signedIn ? t('loading') : Object.entries(errs).map(([k,v])=>`${k}: ${v}`).join(' · ');
  };
  $('#addSite').addEventListener('click', ()=>{ draft.push({id:'',name:'',url:'',gscProperty:'',gaProperty:'',adsDomain:'',bingSite:'',keyPages:[]}); drawForms(); });
  $('#saveSites').addEventListener('click', async ()=>{
    const clean = draft.filter(s=>(s.url||'').trim()).map(s=>({...s, keyPages:(s.keyPages||[]).map(x=>x.trim()).filter(Boolean)}));
    try{ await api('/api/sites',{method:'POST',json:clean}); toast(t('saved')); await loadState(); draft = JSON.parse(JSON.stringify(S.sites)); drawForms(); renderNav(); }catch(e){ toast(t('err',{e:e.message})); }
  });
  const loadOpts = async ()=>{ if(!S.signedIn && !S.hasBingKey){ OPTIONS={}; drawForms(); return; } OPTIONS=null; drawForms(); try{ OPTIONS = await api('/api/options'); }catch(e){ OPTIONS={errors:{google:e.message}}; } drawForms(); };
  $('#reloadOpts').addEventListener('click', loadOpts);
  drawForms(); if(OPTIONS===null) loadOpts();
}
function hostOf(u){ try{ return new URL(/^https?:/.test(u)?u:'https://'+u).hostname.toLowerCase(); }catch(e){ return ''; } }
function autoMatch(s){
  const o = OPTIONS||{}; const host = hostOf(s.url); if(!host) return;
  const bare = host.replace(/^www\./,''); const path = (()=>{ try{ return new URL(/^https?:/.test(s.url)?s.url:'https://'+s.url).pathname; }catch(e){ return '/'; } })();
  if(!s.name) s.name = bare + (path.length>1 ? path.replace(/\/$/,'') : '');
  // Search Console: longest matching URL-prefix property, else domain property
  const gsc = (o.gsc||[]).map(x=>x.url);
  const prefixes = gsc.filter(u=>!u.startsWith('sc-domain:') && (s.url.startsWith(u) || ('https://'+host+path).startsWith(u))).sort((a,b)=>b.length-a.length);
  s.gscProperty = prefixes[0] || gsc.find(u=>u==='sc-domain:'+bare) || gsc.find(u=>u.startsWith('sc-domain:') && bare.endsWith(u.slice(10))) || s.gscProperty;
  const ga = (o.ga||[]).find(x=>x.name.toLowerCase().includes(bare)); if(ga && !s.gaProperty) s.gaProperty = ga.id;
  const ads = (o.ads||[]).find(x=>x.domain.replace(/^www\./,'')===bare || bare.endsWith('.'+x.domain.replace(/^www\./,''))); if(ads) s.adsDomain = ads.domain.replace(/^www\./,'');
  const bing = (o.bing||[]).filter(u=>hostOf(u).replace(/^www\./,'')===bare).sort((a,b)=>b.length-a.length); if(bing.length) s.bingSite = bing[0];
}

// tell the app when this window goes away, so it can quit right away
// keep a live connection open: when this window closes, Site Pulse sees it drop and quits
// Each window Site Pulse opens carries its own token (?w=...). sessionStorage keeps it for this
// window across reloads and the Google sign-in round trip.
try{
  const q = new URLSearchParams(location.search).get('w');
  if(q){ try{ sessionStorage.setItem('sp_w', q); }catch(e){} }
  let tok = q; if(!tok){ try{ tok = sessionStorage.getItem('sp_w'); }catch(e){} }
  const es = new EventSource('/api/live?w='+encodeURIComponent(tok||''));
  const goAway = ()=>{
    es.close();
    document.body.innerHTML = `<main><div class="card">${t('replaced_window')}</div></main>`;
    setTimeout(()=>window.close(), 300);
  };
  // a newer Site Pulse window was opened: stop holding the app open and close this one
  es.addEventListener('replaced', goAway);
  // the app answered "not the current window" (204): EventSource stops for good
  es.onerror = ()=>{ if(es.readyState===EventSource.CLOSED) goAway(); };
}catch(e){}
// ---------------- boot ----------------
(async function boot(){
  await loadState();
  try{ await loadRun(); }catch(e){ RUN=null; }
  try{ await loadMetrics(); }catch(e){}
  await render();
  // refresh when a scheduled check completes in the background
  let lastDates = (S.runDates||[]).join(), lastBusy = S.busy;
  setInterval(async ()=>{
    try{ const st = await api('/api/state'); const changed = st.runDates.join()!==lastDates || st.busy!==lastBusy;
      lastDates = st.runDates.join(); lastBusy = st.busy; S = {...S, ...st};
      if(changed){ if(!st.busy){ await loadRun(); await loadMetrics(); notifyCritical(RUN); } if(route().name!=='settings') render(); else renderNav(); } }catch(e){}
  }, 15000);
})();
</script>
